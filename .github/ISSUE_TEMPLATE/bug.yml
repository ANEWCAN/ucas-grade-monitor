name: Bug 报告
about: 报告可复现的问题（请勿提交真实账号或成绩）
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除账号、密码、Token、Cookie、Identity、Session 和个人成绩。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 2.6.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题模块
      options:
        - SEP/JWXK 登录
        - 验证码识别
        - 手动查询
        - 自动查询
        - 成绩显示
        - 通知
        - 构建或安装
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用脱敏后的信息描述。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与 Android 版本
      placeholder: Pixel 8 / Android 16
